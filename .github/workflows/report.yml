name: Daily report

# Builds the report from TSM's public data once a day, commits that day's price
# snapshot to history/, and publishes the page to GitHub Pages.
# Optional repository variables: TSM_REGION (default "us"), TSM_REALM (realm slug;
# unset = region-wide prices).

on:
  schedule:
    - cron: "17 10 * * *" # TSM's region file refreshes daily around 09:00 UTC
  push:
    branches: [main]
    paths: ["data/**", "waylay/**", ".github/workflows/report.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests

      - name: Build report
        env:
          TSM_REGION: ${{ vars.TSM_REGION || 'us' }}
          TSM_REALM: ${{ vars.TSM_REALM }}
        run: |
          args=(--region "$TSM_REGION")
          if [ -n "$TSM_REALM" ]; then args+=(--realm "$TSM_REALM"); fi
          python -m waylay build "${args[@]}" --out site

      - name: Commit price snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "No new snapshot"
          else
            git commit -m "Price snapshot $(date -u +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
