name: Daily report

# Builds one page per region/ruleset in data/sources.json from TSM's public data
# once a day, commits that day's price snapshots to history/, and publishes the
# pages to GitHub Pages.

on:
  schedule:
    - cron: "17 10 * * *" # TSM's region file refreshes daily around 09:00 UTC
  push:
    branches: [main]
    paths: ["data/**", "waylay/**", ".github/workflows/report.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests

      - name: Build report
        run: python -m waylay build --all --out site

      - name: Commit price snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "No new snapshot"
          else
            git commit -m "Price snapshot $(date -u +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
