[project]
name = "waylay"
version = "0.1.0"
description = "Cheapest Merchant's Favor and Commerce Authority reputation in WoW Forever, from TradeSkillMaster prices."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
waylay = "waylay.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["waylay"]

[tool.setuptools.package-data]
waylay = ["template.html"]
